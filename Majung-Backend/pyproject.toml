[project]
name = "majung-backend"
version = "0.1.0"
description = "마중365 백엔드 — 출소자 재사회화 온보딩 (triage 챗 + 제도 KB + 센터 API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "anthropic>=0.69.0",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2",
    "truststore>=0.10.4",
    "cryptography>=44.0",
    "supabase>=2.31.0",
    "python-socketio>=5.16.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트/설명은 한국어 자연어 문자열이라 줄 길이 제한 예외
"app/domains/chat/domain/prompts.py" = ["E501"]
"app/domains/chat/domain/suggestions.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
